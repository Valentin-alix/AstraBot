name: Package release

on:
  workflow_call:

concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify LFS assets
        run: git lfs fsck
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Set up Python and dependencies
        run: uv sync --frozen
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+_\d+\.\d+\.\d+\.\d+$') {
            throw "VERSION must use the Ankama X.Y_A.B.C.D format, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows package
        env:
          ASTRABOT_GITHUB_CLIENT_ID: ${{ vars.ASTRABOT_GITHUB_CLIENT_ID }}
        run: uv run poe package
      - name: Validate packaged startup and shutdown
        env:
          ASTRABOT_GITHUB_CLIENT_ID: ${{ vars.ASTRABOT_GITHUB_CLIENT_ID }}
        run: uv run python -m scripts.packaging.validate_package dist/AstraBot
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Velopack installer
        shell: pwsh
        env:
          PACKAGE_VERSION: 1.0.${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global vpk --version 1.2.161
          vpk pack --packId ValentinAlix.AstraBot --packVersion $env:PACKAGE_VERSION --packDir dist/AstraBot --mainExe AstraBot.exe --runtime win-x64 --noPortable --outputDir dist/velopack
          Get-ChildItem dist/velopack -File | Where-Object Length -ge 2GB | ForEach-Object {
            throw "Release asset exceeds the GitHub size limit: $($_.Name)"
          }
      - name: Publish Velopack release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: 1.0.${{ github.run_number }}
          GAME_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN --publish --tag "v$env:PACKAGE_VERSION" --releaseName "AstraBot $env:PACKAGE_VERSION (Dofus $env:GAME_VERSION)" --targetCommitish "${{ github.sha }}" --outputDir dist/velopack
